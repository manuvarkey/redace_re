# One-time launcher; remove after the v1.6.2 release completes.
name: Release v1.6.2

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-v1.6.2.yml']

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Create v1.6.2 at the current release commit
        run: |
          if git ls-remote --exit-code origin refs/tags/v1.6.2 >/dev/null 2>&1; then
            git fetch origin tag v1.6.2
            test "$(git rev-list -n 1 v1.6.2)" = "$GITHUB_SHA"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a v1.6.2 -m 'Release v1.6.2'
            git push origin refs/tags/v1.6.2
          fi
  release:
    needs: tag
    uses: ./.github/workflows/release.yml
    with:
      release_tag: v1.6.2
    secrets: inherit

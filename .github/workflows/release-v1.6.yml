# One-time launcher; remove after the v1.6 release completes.
name: Release v1.6

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-v1.6.yml']

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7544ee1d8ea24483d1c5e6c63789fca9af13cb47
      - name: Create v1.6 at the validated release commit
        run: |
          if git ls-remote --exit-code origin refs/tags/v1.6 >/dev/null 2>&1; then
            git fetch origin tag v1.6
            test "$(git rev-list -n 1 v1.6)" = 7544ee1d8ea24483d1c5e6c63789fca9af13cb47
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a v1.6 -m 'Release v1.6'
            git push origin refs/tags/v1.6
          fi
  release:
    needs: tag
    uses: ./.github/workflows/release.yml
    with:
      release_tag: v1.6
    secrets: inherit

# Builds every preset and attaches them to a GitHub release when a v* tag is pushed
# (git tag -a v1.0 -m "..." && git push origin v1.0).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Restore persistent Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          python3 - <<'PYKEY'
          import base64, os
          from pathlib import Path
          required = ('KEYSTORE_BASE64', 'KEYSTORE_ALIAS', 'KEYSTORE_PASSWORD')
          if any(not os.environ.get(name) for name in required):
              raise SystemExit('Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_ALIAS and ANDROID_KEYSTORE_PASSWORD repository secrets. Never generate a new key per release.')
          key = Path(os.environ['RUNNER_TEMP']) / 'redace-release.keystore'
          key.touch(mode=0o600)
          key.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          key.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f'GODOT_ANDROID_KEYSTORE_RELEASE_PATH={key}\n')
          PYKEY

      - name: Install cabextract
        run: sudo apt-get update && sudo apt-get install -y cabextract

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-all

      - name: Download Godot and the export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-stable
          # start clean: unzip would otherwise stop and ask before replacing a file
          rm -rf ~/godot && mkdir -p ~/godot/templates && cd ~/godot
          curl -fsSL -o godot.zip "$base/Godot_v$GODOT_VERSION-stable_linux.x86_64.zip"
          unzip -o -q godot.zip && rm godot.zip
          curl -fsSL -o templates.tpz "$base/Godot_v$GODOT_VERSION-stable_export_templates.tpz"
          unzip -o -q -j templates.tpz templates/version.txt templates/web_nothreads_release.zip \
            templates/linux_release.x86_64 templates/windows_release_x86_64.exe \
            templates/android_debug.apk templates/android_release.apk -d templates
          rm templates.tpz

      - name: Install the export templates and editor settings
        run: |
          dir=~/.local/share/godot/export_templates/$GODOT_VERSION.stable
          mkdir -p "$dir" && cp ~/godot/templates/* "$dir/"
          # Godot reads the Android SDK and JDK paths from its editor settings.
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' \
            "$ANDROID_HOME" "$JAVA_HOME" > ~/.config/godot/editor_settings-4.7.tres

      - name: Build Web, Linux and Windows
        run: GODOT=~/godot/Godot_v$GODOT_VERSION-stable_linux.x86_64 ./build.sh Web Linux Windows

      - name: Build Android with persistent signing and release version
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p build/android
          python3 - <<'PYEXPORT'
          import os, re, subprocess
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          match = re.fullmatch(r'v(\d+)\.(\d+)(?:\.(\d+))?', tag)
          if not match:
              raise SystemExit('Android releases require a vMAJOR.MINOR[.PATCH] tag.')
          major, minor, patch = (int(n or 0) for n in match.groups())
          code = major * 1000000 + minor * 1000 + patch
          if minor > 999 or patch > 999 or not 1 <= code <= 2100000000:
              raise SystemExit('Android version components/code are out of range.')
          presets = Path('redace/export_presets.cfg')
          original = presets.read_text()
          marker = '[preset.3.options]'
          if marker not in original:
              raise SystemExit('Android preset options were not found.')
          before, options = original.split(marker, 1)
          options, count = re.subn(r'^version/code=\d+$', f'version/code={code}', options, flags=re.M)
          if count != 1:
              raise SystemExit('Expected one Android version/code setting.')
          options, count = re.subn(r'^version/name="[^\"]+"$', f'version/name="{tag[1:]}"', options, flags=re.M)
          if count != 1:
              raise SystemExit('Expected one Android version/name setting.')
          godot = Path.home() / 'godot' / f'Godot_v{os.environ["GODOT_VERSION"]}-stable_linux.x86_64'
          try:
              presets.write_text(before + marker + options)
              subprocess.run([str(godot), '--headless', '--path', 'redace', '--export-release', 'Android'], check=True)
          finally:
              presets.write_text(original)
          PYEXPORT

      - name: Package
        run: |
          v=${RELEASE_TAG}
          mkdir dist
          (cd build/linux && zip -q -9 ../../dist/redace-$v-linux-x86_64.zip redace.x86_64 redace.pck)
          (cd build/windows && zip -q -9 ../../dist/redace-$v-windows-x86_64.zip redace.exe redace.pck)
          (cd build/web && zip -q -9 -r ../../dist/redace-$v-web.zip .)
          cp build/android/redace.apk dist/redace-$v-android.apk
          ls -l dist

      # Release text: docs/release-notes/<tag>.md (what is new) when it exists, then how to install
      - name: Release notes
        run: |
          notes=docs/release-notes/${RELEASE_TAG}.md
          {
            if [ -f "$notes" ]; then cat "$notes"; echo; fi
            echo "## Download and play"
            echo
            echo "Builds of the Godot 4 remake at ${RELEASE_TAG}."
            echo
            echo '- **Windows** / **Linux** (x86_64): unzip and run `redace.exe` / `redace.x86_64` (keep `redace.pck` next to it).'
            echo '- **Web**: unzip onto any static web server, or play at https://manuvarkey.github.io/redace_re/.'
            echo '- **Android**: install the APK (release-signed, arm64 and x86_64; allow installs from unknown sources).'
            echo '  Future APKs use the same signing key so updates preserve pilots and settings.'
            echo '  Tilt to steer, or tap STICK for a drag stick.'
          } > release-body.md
          cat release-body.md

      - uses: softprops/action-gh-release@v2
        with:
          name: Red Ace remake ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release-body.md
          files: dist/*

      - name: Remove temporary signing key
        if: always()
        run: python3 -c 'import os; from pathlib import Path; (Path(os.environ["RUNNER_TEMP"]) / "redace-release.keystore").unlink(missing_ok=True)'

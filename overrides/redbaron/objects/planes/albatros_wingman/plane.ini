; Red Baron mod: another Jasta 11 pilot's Albatros: red with a yellow band (never the Baron's own paint).
; Red Baron mod: tuned player-side Albatros (design "Player plane stats"). Model and textures are the stock
; albertross until the paint pass; tools/build_planes.py copies them here into game_data.
; Guns match the original mission 1 player (aircodh2: firerate 25, 1.4 s bursts, 0.1 s pauses = 23.3 rounds/s);
; the stock Albatros fires 4.4 rounds/s (firerate 10, 0.8 s on, 1.0 s off).

[preset.0.options]

variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/head_include="<script>
// Red Ace touch support: tilt for TouchControls.gravity() and fullscreen landscape on phones.
// devicemotion gives the reaction to gravity on the device axes; rotate it to the screen (x right, y up)
// by the screen angle and negate it to match Godot's Input.get_gravity() on Android.
window.addEventListener('devicemotion', function (e) {
  var a = e.accelerationIncludingGravity;
  if (!a || a.x === null) return;
  var ang = (screen.orientation ? screen.orientation.angle : window.orientation || 0) * Math.PI / 180;
  var c = Math.cos(ang), s = Math.sin(ang);
  window.raTx = -(a.x * c - a.y * s);
  window.raTy = -(a.x * s + a.y * c);
  window.raTz = -a.z;
});
// touchend (not pointerdown) carries the user activation that requestFullscreen needs; capture phase
// because the canvas handles the touch itself.
document.addEventListener('touchend', function first() {
  if (document.fullscreenElement || !document.documentElement.requestFullscreen) return;
  document.documentElement.requestFullscreen().then(function () {
    if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {});
  }).catch(function () {});
}, true);
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false


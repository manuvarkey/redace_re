; ---- Hawker: group 4 + target (escaping is not a kill). Starts ahead of the Baron and off to his side, crossing his
; track a little higher, not lined up for a head-on pass. He out-turns the Albatros (roll and pitch above its 80 / 90)
; but is slower in a straight line (100 against 110), so position and patience win, and a retreat can be caught.
; m01.gd flies the duel: gun attack, an evasive break when the Baron settles on his tail (then a recovery pause),
; and the retreat (a dive for the British lines) at 200 s or when badly hit.
[air1]
name = aircodh2_rb
id = 3002
groups = 144
endurance = 120      ; the duel must last (default 45: a head-on pass ended it in seconds)
highspeed = 100      ; slower than the Albatros (110): his retreat can be intercepted; leaving the map fails at once
highroll = 100       ; out-turns the Albatros (80 / 65 roll, 90 / 65 pitch)
lowroll = 85
highpitch = 105
lowpitch = 85
pos = 9650 540 8950
up = 0 1 0
at = -1.000 0 0.000
right = 0.000 0 1.000


template = 21
title = Hawker
photo = albatros_d2_photo
target = dh2_target

[mod]
init = res://mods/redbaron/init.gd
script = res://mods/redbaron/missions/m01.gd
intro = A British DH.2 crossing ahead of you. Take the height and wait for your shot.
objective = Shoot down Major Hawker's DH.2
prioritylabel = Hawker
escape = 3002

<center>First Sortie<br>Jasta 11, January 1917.</center><br>
January 1917. You take command of Jasta 11. Leutnant Brenner flies on your wing today.
Teach him the first rule: we never chase alone.<br>
<font face="courier new" size=4 color=#ffffff><center>Objective : Bring Brenner back into formation and lead him home.</center></font><br>
<center>Leutnant Brenner lost: mission failed.</center>

; Mission 4: Scramble (design "4. Scramble"). Country map; the home aerodrome at about (6200, 7450).
[build]
template = 6
title = Scramble
intact = 6200 7450 20000   ; behind German lines: every bombed building and burnt tree on the map stands
regroup = 8 6047 7414 6048 7446 6048 7478 6105 7457 6166 7443 6219 7473   ; the six hangars and the tent: protect group 3

[mod]
init = res://mods/redbaron/init.gd
script = res://mods/redbaron/missions/objective.gd
intro = Raiders over the aerodrome! Get airborne. Save the hangars.
mark = 6200 7450
counter = 9|Raiders down

[music]
track = 2

[map]
map = country

[mission]
Group3 = 60           ; fail below 60 % of the hangars
Group9 = -100

[objectives]
group3 = hangars
group9 = raiders

; ---- the Baron, parked on the field (no goals: a take-off)
[air0]
name = albatros_red
id = 3001
groups = 256
player = 1
ordinancetype = 2
numordinance = 10
pos = 5966.483398 381.914673 7729.238281
up = 0 1 0
at = 1 0 0
right = 0 0 -1

; ---- Brenner and a second Jasta 11 pilot already in the air over the field, going for the raiders

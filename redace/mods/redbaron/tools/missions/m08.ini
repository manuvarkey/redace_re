; Mission 8: Wounded (design: "8. Wounded"). Country map; German aerodrome at about (6200, 7450).
[build]
template = 6
intact = 6200 7450 700   ; the home aerodrome stands (stock mission 6 shows it bombed)
title = Wounded

[mod]
init = res://mods/redbaron/init.gd
script = res://mods/redbaron/missions/m08.gd

[music]
track = 2

[map]
map = country

[mission]
requireshotdown = 1

; ---- the Baron
[air0]
name = albatros_red
id = 3001
groups = 256
player = 1
ordinancetype = 2
numordinance = 10
pos = 6600 650 7350
up = 0 1 0
at = 1 0 0
right = 0 0 -1

[air0goal0]
type = 256
targetid = 0
pos = 6600 650 7350
real = 50


; Mission 9: Dusk Raiders (design "9. Dusk Raiders"). Country map, dusk; the rail yard at about (7500, 6500).
[build]
template = 6
title = Dusk Raiders
photo = red_albatros_photo
target = handleypage_target
intact = 6200 7450 20000   ; behind German lines: every bombed building and burnt tree on the map stands
; railway: the main line through the yard and on beyond it both ways, three sidings on the south side between two
; ladders of junctions, and a platform siding by the stations (m09.gd puts every segment on the terrain)
track = 6500 6420 7150 6500 7900 6500 8700 6600 | 7150 6500 7310 6590 7740 6590 7900 6500 | 7203 6530 7847 6530 | 7257 6560 7793 6560 | 7230 6500 7300 6470 7700 6470 7770 6500

[mod]
init = res://mods/redbaron/init.gd
script = res://mods/redbaron/missions/m09.gd
intro = Bombers approaching from the northeast. Fighters ahead of them!
objective = Shoot down the three Handley Pages (marked red) before they wreck the rail yard (green)
prioritylabel = Handley Page
mark = 7500 6500
counter = 7|Bombers down
protect = 3|Rail yard

[music]
track = 2

[map]
map = country

[environment]
sky = res://game_data/maps/trenches/
fogcolour = 58 52 66
ambient = 150 140 140
light = 150 125 120

[mission]
Group3 = 60           ; fail below 60 % of the six yard objects
Group7 = -100
requireshotdown = 1

[objectives]
group3 = rail yard
group7 = bombers


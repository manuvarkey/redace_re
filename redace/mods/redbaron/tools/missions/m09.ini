; Mission 9: Dusk Raiders (design "9. Dusk Raiders"). Country map, dusk; the rail yard at about (7500, 6500).
[build]
template = 6
title = Dusk Raiders
photo = red_albatros_photo
target = handleypage_target
intact = 6200 7450 20000   ; behind German lines: every bombed building and burnt tree on the map stands

[mod]
init = res://mods/redbaron/init.gd
script = res://mods/redbaron/missions/m09.gd
intro = Handley Pages with Camel escorts for the rail yard. Bring the bombers down before they reach it.
mark = 7500 6500
counter = 7|Bombers down

[music]
track = 2

[map]
map = country

[environment]
sky = res://game_data/maps/trenches/
fogcolour = 58 52 66
ambient = 150 140 140
light = 150 125 120

[mission]
Group3 = 60           ; fail below 60 % of the six yard objects
Group7 = -100
requireshotdown = 1

[objectives]
group3 = rail yard
group7 = bombers


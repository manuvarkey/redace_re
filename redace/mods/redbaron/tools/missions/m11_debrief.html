March 1918. Leutnant Brenner did not come home. His second is safe, and the two-seater crew with him.<br><br><i>Madam, it is my duty to tell you that your son fell today. He died saving my life. He was the finest pilot I have trained, and I will not forget him.<br>Rittmeister Manfred Freiherr von Richthofen</i>

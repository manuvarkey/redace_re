<center>The Last Patrol<br>Jagdgeschwader 1, 21 April 1918.</center><br>
21 April 1918. Most of the Jasta are new boys. Bring them home.<br>
<font face="courier new" size=4 color=#ffffff><center>Objective : Get all four of the new pilots home.</center></font><br>
<center>They are making for our side of the map. Keep the Camels off them.</center>
